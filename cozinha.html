<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cozinha</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="texto1">
        <h1>Cozinha</h1>
        <p>Pedidos</p>
    </div>

    <hr>

    <div class="cozinha">

        <div class="coluna">
            <h2>Novos pedidos</h2>
            <div id="novos"></div>
        </div>

        <div class="coluna">
            <h2>Em preparo</h2>
            <div id="preparo"></div>
        </div>

        <div class="coluna">
            <h2>Preparados</h2>
            <div id="preparados"></div>
        </div>

        <div class="coluna">
            <h2>Últimos Pedidos</h2>
            <div id="concluidos"></div>
        </div>

    </div>

    <script>

        function mostrarPedidos() {

            const pedidos = JSON.parse(localStorage.getItem("pedidos")) || [];

            const novos = document.getElementById("novos");
            const preparo = document.getElementById("preparo");
            const preparados = document.getElementById("preparados");
            const concluidos = document.getElementById("concluidos");

            novos.innerHTML = "";
            preparo.innerHTML = "";
            preparados.innerHTML = "";
            concluidos.innerHTML = "";

            pedidos.forEach((pedido, index) => {

                const card = document.createElement("div");
                card.className = "pedido";

                let conteudo = `
                    <h3>Pedido #${index + 1}</h3>
                    <p><strong>${pedido.combo}</strong></p>
                `;

                if (pedido.sabor1) {
                    conteudo += `<p>Sabor 1: ${pedido.sabor1}</p>`;
                }

                if (pedido.sabor2) {
                    conteudo += `<p>Sabor 2: ${pedido.sabor2}</p>`;
                }

                if (pedido.descricao) {
                    conteudo += `<p>Descrição: ${pedido.descricao}</p>`;
                }

                if (pedido.status === "novo") {

                    conteudo += `
                        <button onclick="preparar(${index})">
                            Começar preparo
                        </button>
                    `;
                    card.innerHTML = conteudo;
                    novos.appendChild(card);

                } else if (pedido.status === "preparo") {

                    conteudo += `
                        <button onclick="finalizar(${index})">
                            Marcar como preparado
                        </button>
                    `;
                    card.innerHTML = conteudo;
                    preparo.appendChild(card);

                } else if (pedido.status === "preparado") {

                    conteudo += `
                        <button onclick="arquivar(${index})">
                            Mover para Concluídos
                        </button>
                    `;
                    card.innerHTML = conteudo;
                    preparados.appendChild(card);

                } else if (pedido.status === "concluido") {

                    conteudo += `
                        <p class="pronto">✓ Pedido entregue</p>
                    `;
                    card.innerHTML = conteudo;
                    concluidos.appendChild(card);

                }

            });

        }

        function preparar(index) {
            atualizarStatus(index, "preparo");
        }

        function finalizar(index) {
            atualizarStatus(index, "preparado");
        }

        function arquivar(index) {
            atualizarStatus(index, "concluido");
        }

        function atualizarStatus(index, novoStatus) {
            const pedidos = JSON.parse(localStorage.getItem("pedidos")) || [];
            pedidos[index].status = novoStatus;
            localStorage.setItem("pedidos", JSON.stringify(pedidos));
            mostrarPedidos();
        }

        // Atualiza a lista quando a aba for carregada ou quando houver alteração
        mostrarPedidos();

        // Atualiza automaticamente quando houver novas alterações no mesmo navegador
        window.addEventListener("storage", mostrarPedidos);

    </script>

</body>
</html>
