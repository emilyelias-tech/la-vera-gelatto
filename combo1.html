<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Combo 1</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="texto1">
        <h1>Combo 1</h1>
        <p>1 Bola do sorvete</p>
    </div>

    <hr>
    <br>

    <div class="fundo">

        <br>

        <form id="formPedido">

            <h3>Qual o Sabor?</h3>

            <input
                type="radio"
                id="café"
                name="sabor"
                value="Café"
                required
            >
            <label for="café">Café</label>

            <br><br>

            <input
                type="radio"
                id="creme"
                name="sabor"
                value="Creme"
            >
            <label for="creme">Creme</label>

            <br><br>

            <input
                type="radio"
                id="docedeleite"
                name="sabor"
                value="Doce de leite"
            >
            <label for="docedeleite">Doce de leite</label>

            <br><br>

            <hr>

            <h3>Descrição</h3>

            <textarea
                id="descricao"
                name="descricao"
                placeholder="Descrição"
            ></textarea>

            <div class="menubuttons">

                <button type="submit">
                    Enviar
                </button>

            </div>

        </form>

    </div>


    <script>

        document.getElementById("formPedido").addEventListener("submit", function(event) {

            event.preventDefault();

            const sabor =
                document.querySelector('input[name="sabor"]:checked').value;

            const descricao =
                document.getElementById("descricao").value;


            const pedido = {

                combo: "Combo 1",

                sabor1: sabor,

                descricao: descricao,

                status: "novo"

            };


            const pedidos =
                JSON.parse(localStorage.getItem("pedidos")) || [];


            pedidos.push(pedido);


            localStorage.setItem(
                "pedidos",
                JSON.stringify(pedidos)
            );


            window.location.href = "cozinha.html";

        });

    </script>

</body>

</html>
